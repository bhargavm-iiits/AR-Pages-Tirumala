<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --ground:#241109; --terrain:#2E4A22;
    --surface:#33190E; --surface-raised:#452314; --rule:#5C3821;
    --text:#F5E6C8; --text-2:#B99B7C; --text-3:#8A705A;
    --gold:#F0A93A; --gold-2:#F7C978; --sindoor:#B3392C;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); }
  a { color: var(--gold); } a:hover { color: var(--gold-2); }

  .screen{ position:relative; width:390px; height:844px; overflow:hidden; background:var(--terrain); border-radius:28px; color:var(--text); }
  .glass{ background: rgba(51,25,14,0.82); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .card{ border-radius:18px; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; border-radius:999px; }
  .icon-btn svg{ width:20px; height:20px; }

  .top-pill{ position:absolute; top:14px; left:14px; right:14px; display:flex; align-items:center; gap:10px; padding:12px 10px 12px 16px; z-index:5; }
  .top-pill .txt{ flex:1; min-width:0; }
  .top-pill .title{ font-size:15px; font-weight:700; }
  .top-pill .sub{ font-size:12px; color:var(--text-2); margin-top:2px; }
  .top-pill .gear{ width:40px; height:40px; background:rgba(255,255,255,0.08); flex:0 0 auto; }

  .right-rail{ position:absolute; right:14px; top:50%; transform:translateY(-90px); display:flex; flex-direction:column; gap:10px; z-index:5; }
  .rail-btn{ width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:var(--surface); box-shadow:0 4px 10px rgba(0,0,0,0.35); position:relative; }
  .rail-btn svg{ width:20px; height:20px; }
  .rail-btn.on{ background:var(--gold); }
  .rail-btn.on::before{ content:""; position:absolute; inset:-7px; border-radius:999px; background:rgba(240,169,58,0.35); animation: halo 2.2s ease-in-out infinite; z-index:-1; }
  @keyframes halo{ 0%,100%{ transform:scale(0.9); opacity:0.55; } 50%{ transform:scale(1.2); opacity:0.15; } }
  .rail-btn .lbl{ font-size:10px; font-weight:700; color:var(--text); }

  .next-card{ position:absolute; left:14px; right:14px; bottom:88px; display:flex; align-items:center; gap:12px; padding:10px 16px; z-index:5; }
  .next-card .g-icon{ width:34px; height:34px; flex:0 0 auto; animation: flicker 2.6s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{ filter:brightness(1); } 40%{ filter:brightness(1.35); } 60%{ filter:brightness(0.92); } }
  .next-card .txt{ flex:1; min-width:0; }
  .next-card .name{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .next-card .dist{ font-size:12px; color:var(--text-2); margin-top:2px; }
  .next-card .chev{ color:var(--text-3); font-size:16px; }

  .attribution{ position:absolute; right:14px; bottom:172px; font-size:9px; color:var(--text-3); z-index:4; }

  .navbar{ position:absolute; left:0; right:0; bottom:0; height:78px; background:var(--surface); display:flex; z-index:10; }
  .navtab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-2); position:relative; }
  .navtab svg{ width:22px; height:22px; }
  .navtab .lbl{ font-size:10px; }
  .navtab.active{ color:var(--gold); }
  .navtab.active::after{ content:""; position:absolute; top:4px; width:16px; height:3px; border-radius:999px; background:var(--gold); box-shadow:0 0 6px rgba(240,169,58,0.9); animation: dotpulse 1.6s ease-in-out infinite; }
  @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }

  .pin{ position:absolute; width:26px; height:26px; transform:translate(-50%,-100%); animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,-100%); } 50%{ transform:translate(-50%,-108%); } }

  .user-wrap{ position:absolute; width:0; height:0; }
  .ring{ position:absolute; left:50%; top:50%; width:16px; height:16px; border-radius:999px; border:2px solid var(--gold); transform:translate(-50%,-50%); animation: ping 2.4s ease-out infinite; }
  .ring.d2{ animation-delay:0.8s; }
  .ring.d3{ animation-delay:1.6s; }
  @keyframes ping{ 0%{ width:16px; height:16px; opacity:0.9; } 100%{ width:70px; height:70px; opacity:0; } }
  .userdot{ position:absolute; left:50%; top:50%; width:20px; height:20px; border-radius:999px; background:var(--gold); border:3px solid #F5E6C8; transform:translate(-50%,-50%); z-index:2; }
</style>
</helmet>

<div class="screen">
  <svg viewBox="0 0 390 844" style="position:absolute; inset:0;">
    <defs>
      <pattern id="hatch" width="18" height="18" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#25391B" stroke-width="6"/>
      </pattern>
      <linearGradient id="route" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#B3392C"/>
        <stop offset="50%" stop-color="#F0A93A"/>
        <stop offset="100%" stop-color="#F7C978"/>
      </linearGradient>
    </defs>
    <rect width="390" height="844" fill="#2E4A22"/>
    <rect width="390" height="844" fill="url(#hatch)" opacity="0.5"/>
    <polyline points="70,780 95,700 90,620 130,560 120,480 160,420 150,340 195,270 210,190 250,120"
      fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="70,780 95,700 90,620 130,560 120,480 160,420 150,340 195,270 210,190 250,120"
      fill="none" stroke="#F5E6C8" stroke-width="10" stroke-linecap="round" opacity="0.06"/>
  </svg>

  <svg class="pin" style="left:150px; top:340px; animation-delay:0.2s;" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 1l2.5 4h-5L12 1zM9 6h6l1.4 3H7.6L9 6zm-2 4h10l1.2 3H5.8L7 10zm-1.5 4h13l1.6 4H4l1.5-4zM4 19h16v2H4v-2z"/></svg>
  <svg class="pin" style="left:195px; top:270px; animation-delay:0.9s;" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 1l2.5 4h-5L12 1zM9 6h6l1.4 3H7.6L9 6zm-2 4h10l1.2 3H5.8L7 10zm-1.5 4h13l1.6 4H4l1.5-4zM4 19h16v2H4v-2z"/></svg>
  <svg class="pin" style="left:250px; top:120px; animation-delay:1.5s;" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 1l2.5 4h-5L12 1zM9 6h6l1.4 3H7.6L9 6zm-2 4h10l1.2 3H5.8L7 10zm-1.5 4h13l1.6 4H4l1.5-4zM4 19h16v2H4v-2z"/></svg>

  <div class="user-wrap" style="left:120px; top:480px;">
    <div class="ring"></div><div class="ring d2"></div><div class="ring d3"></div>
    <div class="userdot"></div>
  </div>

  <div class="top-pill card glass">
    <div class="txt"><div class="title">Alipiri to Tirumala</div><div class="sub">Distance 2.1 km &middot; ETA 42 min</div></div>
    <div class="icon-btn gear"><svg viewBox="0 0 24 24" fill="none" stroke="#F5E6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
  </div>

  <div class="right-rail">
    <div class="rail-btn on"><svg viewBox="0 0 24 24" fill="none" stroke="#241109" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></div>
    <div class="rail-btn"><span class="lbl">2D</span></div>
    <div class="rail-btn on"><svg viewBox="0 0 24 24" fill="none" stroke="#241109" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="12,7 14,12 12,17 10,12" fill="#241109" stroke="none"/></svg></div>
  </div>

  <div class="attribution">Basemap &copy; OpenStreetMap contributors</div>

  <div class="next-card card glass">
    <svg class="g-icon" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 1l2.5 4h-5L12 1zM9 6h6l1.4 3H7.6L9 6zm-2 4h10l1.2 3H5.8L7 10zm-1.5 4h13l1.6 4H4l1.5-4zM4 19h16v2H4v-2z"/></svg>
    <div class="txt"><div class="name">Next: Rajagopuram</div><div class="dist">250 m ahead</div></div>
    <div class="chev">&#8250;</div>
  </div>

  <div class="navbar">
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="12,7 14,12 12,17 10,12" fill="currentColor" stroke="none"/></svg><span class="lbl">Navigate</span></div>
    <div class="navtab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="9,3 3,6 3,20 9,17 15,20 21,17 21,3 15,6 9,3"/><line x1="9" y1="3" x2="9" y2="17"/><line x1="15" y1="6" x2="15" y2="20"/></svg><span class="lbl">Map</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 4h-5L12 2zM9 6.5h6l1.2 2.5H7.8L9 6.5zm-1.6 3.5h9.2l1.1 2.5H6.3L7.4 10zm-1.4 3.5h11.6l1.4 3.5H4.6L6 13.5zM4 19h16v2H4v-2z"/></svg><span class="lbl">Landmarks</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span class="lbl">Progress</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span class="lbl">Settings</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
