<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --ground:#14231A; --ground-deep:#0D1811;
    --surface:#1D3226; --surface-raised:#294436; --rule:#3B5C48;
    --text:#EAF2E9; --text-2:#9FB8A8; --text-3:#6E8A79;
    --accent:#4C8C4A; --accent-2:#7FBF6B; --gold:#D9A441; --gold-2:#EFC97A;
    --sky:#4A86D4; --sky-2:#8FC0EF;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); }
  a { color: var(--accent-2); } a:hover { color: var(--gold); }

  .screen{ position:relative; width:390px; height:844px; overflow:hidden; background:var(--ground); border-radius:28px; color:var(--text); isolation:isolate; }

  .glow{ position:absolute; inset:0; background: radial-gradient(circle at 50% 26%, rgba(143,192,239,0.22) 0%, rgba(217,164,65,0.2) 32%, rgba(76,140,74,0.14) 50%, rgba(76,140,74,0) 68%); animation: breathe 4s ease-in-out infinite alternate; }
  @keyframes breathe{ from{ opacity:0.6; } to{ opacity:1; } }

  .icon-btn{ display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:999px; background: rgba(13,24,17,0.55); box-shadow: 0 4px 10px rgba(0,0,0,0.35); }
  .icon-btn svg{ width:22px; height:22px; }
  .glass{ background: rgba(29,50,38,0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .pill{ border-radius:999px; }
  .card{ border-radius:18px; }

  .top-row{ position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; z-index:5; }

  .landmark-pill{ position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:8px 16px 8px 10px; width:230px; z-index:5; }
  .landmark-pill .g-icon{ width:34px; height:34px; flex:0 0 auto; animation: flicker 2.6s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{ filter:brightness(1); } 40%{ filter:brightness(1.3); } 60%{ filter:brightness(0.92); } }
  .landmark-pill .txt{ min-width:0; }
  .landmark-pill .name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .landmark-pill .dist{ font-size:11px; color:var(--text-2); margin-top:1px; }

  .left-rail{ position:absolute; left:14px; top:50%; transform:translateY(-70px); display:flex; flex-direction:column; gap:10px; z-index:5; }
  .rail-btn{ width:48px; height:48px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1px; background:rgba(13,24,17,0.55); box-shadow:0 4px 10px rgba(0,0,0,0.35); position:relative; }
  .rail-btn svg{ width:20px; height:20px; }
  .rail-btn.on{ background:var(--sky); }
  .rail-btn.on::before{ content:""; position:absolute; inset:-8px; border-radius:999px; background:rgba(74,134,212,0.4); animation: halo 2.2s ease-in-out infinite; z-index:-1; }
  @keyframes halo{ 0%,100%{ transform:scale(0.9); opacity:0.55; } 50%{ transform:scale(1.18); opacity:0.15; } }
  .rail-btn .lbl{ font-size:9px; font-weight:700; color:#eafbea; line-height:1; }

  .step-badge{ position:absolute; right:14px; top:50%; transform:translateY(-46px); width:66px; height:78px; border-radius:16px; background:rgba(13,24,17,0.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; box-shadow:0 4px 10px rgba(0,0,0,0.35); z-index:5; }
  .step-badge svg{ width:22px; height:22px; }
  .step-badge .n{ font-size:11px; font-weight:700; color:var(--text); text-align:center; line-height:1.2; }

  .trail{ position:absolute; left:50%; bottom:230px; transform:translateX(-50%); width:46px; height:120px; z-index:3; }
  .trail svg{ position:absolute; left:0; width:46px; height:26px; filter: drop-shadow(0 0 8px rgba(143,192,239,0.85)); animation: rise 1.8s ease-in infinite; opacity:0; }
  .trail svg:nth-child(1){ bottom:0; animation-delay:0s; }
  .trail svg:nth-child(2){ bottom:32px; animation-delay:0.35s; }
  .trail svg:nth-child(3){ bottom:64px; animation-delay:0.7s; }
  .trail svg:nth-child(4){ bottom:96px; animation-delay:1.05s; }
  @keyframes rise{ 0%{ opacity:0; transform:translateY(14px); } 20%{ opacity:1; transform:translateY(0); } 75%{ opacity:0.6; } 100%{ opacity:0; transform:translateY(-14px); } }

  .stat-card{ position:absolute; left:14px; right:14px; bottom:88px; padding:12px 16px 14px; z-index:5; }
  .stat-row{ display:flex; }
  .stat-col{ flex:1; text-align:center; }
  .stat-col .v{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-col .c{ font-size:11px; color:var(--text-3); margin-top:2px; }
  .progress-track{ height:6px; border-radius:999px; background:var(--surface-raised); margin-top:10px; overflow:hidden; position:relative; }
  .progress-fill{ height:100%; width:45%; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--sky), var(--gold-2), var(--sky), var(--accent)); background-size:220% 100%; animation: shimmer 3.2s linear infinite; }
  @keyframes shimmer{ from{ background-position:0% 0; } to{ background-position:220% 0; } }

  .navbar{ position:absolute; left:0; right:0; bottom:0; height:78px; background:var(--surface); display:flex; z-index:10; }
  .navtab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-2); position:relative; }
  .navtab svg{ width:22px; height:22px; }
  .navtab .lbl{ font-size:10px; }
  .navtab.active{ color:var(--sky-2); }
  .navtab.active::after{ content:""; position:absolute; top:4px; width:16px; height:3px; border-radius:999px; background:var(--sky-2); box-shadow:0 0 6px rgba(143,192,239,0.9); animation: dotpulse 1.6s ease-in-out infinite; }
  @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }
</style>
</helmet>

<div class="screen">
  <svg class="ar-scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:0;">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3E6B93"/>
        <stop offset="30%" stop-color="#2C4A49"/>
        <stop offset="60%" stop-color="#1c2f21"/>
        <stop offset="100%" stop-color="#0D1811"/>
      </linearGradient>
      <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3B5C48"/>
        <stop offset="100%" stop-color="#1D3226"/>
      </linearGradient>
    </defs>
    <rect width="390" height="844" fill="url(#sky)"/>
    <!-- distant hill ridges, hazy back to front -->
    <polygon points="0,340 80,280 160,320 230,260 310,300 390,270 390,844 0,844" fill="#25412F" opacity="0.55"/>
    <polygon points="0,420 70,370 150,410 240,350 320,395 390,360 390,844 0,844" fill="#20392A" opacity="0.75"/>
    <polygon points="0,520 90,460 180,505 260,450 340,495 390,470 390,844 0,844" fill="#1A2E22"/>
    <!-- tree-line silhouettes flanking the stairway -->
    <polygon points="0,844 40,844 120,470 108,470" fill="#1D3226"/>
    <polygon points="390,844 350,844 270,470 282,470" fill="#1D3226"/>
    <polygon points="55,844 85,844 140,500 132,500" fill="#294436"/>
    <polygon points="335,844 305,844 250,500 258,500" fill="#294436"/>
    <!-- staircase -->
    <polygon points="140,844 250,844 210,470 180,470" fill="url(#step)"/>
    <g stroke="#14231A" stroke-width="3" opacity="0.6">
      <line x1="150" y1="800" x2="240" y2="800"/>
      <line x1="155" y1="750" x2="235" y2="750"/>
      <line x1="160" y1="700" x2="230" y2="700"/>
      <line x1="165" y1="650" x2="225" y2="650"/>
      <line x1="169" y1="600" x2="221" y2="600"/>
      <line x1="173" y1="550" x2="217" y2="550"/>
      <line x1="176" y1="500" x2="214" y2="500"/>
    </g>
  </svg>
  <div class="glow"></div>

  <div class="trail">
    <svg viewBox="0 0 46 26"><polyline points="4,22 23,4 42,22" fill="none" stroke="var(--sky)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 46 26"><polyline points="4,22 23,4 42,22" fill="none" stroke="var(--sky)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 46 26"><polyline points="4,22 23,4 42,22" fill="none" stroke="var(--sky)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 46 26"><polyline points="4,22 23,4 42,22" fill="none" stroke="var(--sky)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="top-row">
    <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF2E9" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></div>
    <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF2E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
  </div>

  <div class="landmark-pill glass pill">
    <svg class="g-icon" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 1l2.5 4h-5L12 1zM9 6h6l1.4 3H7.6L9 6zm-2 4h10l1.2 3H5.8L7 10zm-1.5 4h13l1.6 4H4l1.5-4zM4 19h16v2H4v-2z"/></svg>
    <div class="txt"><div class="name">Rajagopuram</div><div class="dist">250 m ahead</div></div>
  </div>

  <div class="left-rail">
    <div class="rail-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF2E9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="1.6" x2="12" y2="3.6"/><line x1="12" y1="20.4" x2="12" y2="22.4"/><line x1="1.6" y1="12" x2="3.6" y2="12"/><line x1="20.4" y1="12" x2="22.4" y2="12"/><polygon points="12,7 14,12 12,17 10,12" fill="#EAF2E9" stroke="none"/></svg></div>
    <div class="rail-btn on"><span class="lbl">AR</span></div>
    <div class="rail-btn on"><span class="lbl">Auto</span></div>
    <div class="rail-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF2E9" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg></div>
  </div>

  <div class="step-badge">
    <svg viewBox="0 0 24 24" fill="var(--gold)"><path d="M3 20h4v-3h4v-3h4v-3h4V8h-4v3h-4v3H7v3H3v3z"/></svg>
    <div class="n">Steps<br>~200</div>
  </div>

  <div class="stat-card card glass">
    <div class="stat-row">
      <div class="stat-col"><div class="v">1.8 km</div><div class="c">Distance</div></div>
      <div class="stat-col"><div class="v">Rajagopuram</div><div class="c">Next Landmark</div></div>
      <div class="stat-col"><div class="v">38 min</div><div class="c">ETA</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="navbar">
    <div class="navtab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="12,7 14,12 12,17 10,12" fill="currentColor" stroke="none"/></svg><span class="lbl">Navigate</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="9,3 3,6 3,20 9,17 15,20 21,17 21,3 15,6 9,3"/><line x1="9" y1="3" x2="9" y2="17"/><line x1="15" y1="6" x2="15" y2="20"/></svg><span class="lbl">Map</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 4h-5L12 2zM9 6.5h6l1.2 2.5H7.8L9 6.5zm-1.6 3.5h9.2l1.1 2.5H6.3L7.4 10zm-1.4 3.5h11.6l1.4 3.5H4.6L6 13.5zM4 19h16v2H4v-2z"/></svg><span class="lbl">Landmarks</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span class="lbl">Progress</span></div>
    <div class="navtab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span class="lbl">Settings</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
